<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La course de Zizou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#101a33; --costume:#1b2744; --chaux:#f3f2ec; --banc:#d4213d; --gazon:#2f6b3a; --brume:#9aa6c2;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --texte:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --nuit:#f3f2ec; --costume:#e4e3da; --chaux:#101a33; --brume:#4b5670; }
}
:root[data-theme="light"]{ --nuit:#f3f2ec; --costume:#e4e3da; --chaux:#101a33; --brume:#4b5670; }
:root[data-theme="dark"]{ --nuit:#101a33; --costume:#1b2744; --chaux:#f3f2ec; --brume:#9aa6c2; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; background:var(--nuit); color:var(--chaux);
  font-family:var(--texte); font-size:1.125rem; line-height:1.4;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  overflow-x:hidden;
}
main{width:min(100%,1100px); padding:clamp(1rem,4vw,3rem) clamp(1rem,4vw,2rem); position:relative}
h1{
  font-family:var(--display); font-weight:900; text-transform:uppercase;
  font-size:clamp(3.2rem,13vw,9.5rem); line-height:.82; letter-spacing:-.01em;
  margin:0 0 -.12em; position:relative; z-index:2;
  animation:sprint 1.1s cubic-bezier(.2,.9,.2,1) both;
}
h1 span{display:block; padding-left:clamp(1rem,12vw,9rem)}
@keyframes sprint{from{transform:translateX(-18vw);opacity:0}to{transform:none;opacity:1}}
.ecran{position:relative; z-index:1}
.ecran::before{ /* la ligne de touche */
  content:""; position:absolute; left:-50vw; right:-50vw; top:78%; height:6px;
  background:var(--chaux); opacity:.9; z-index:-1;
}
video{
  display:block; width:100%; height:auto; aspect-ratio:1180/602; background:#000;
  border:4px solid var(--chaux);
}
.bas{
  display:flex; flex-wrap:wrap; gap:1rem 2rem; align-items:center; justify-content:space-between;
  margin-top:1.25rem;
}
.compteur{margin:0; font-size:1.35rem; font-weight:500}
.compteur strong{font-family:var(--display); font-weight:900; font-size:2.4rem; color:var(--banc); vertical-align:-.12em; font-variant-numeric:tabular-nums}
button{
  font:600 1.15rem/1 var(--texte); color:#fff; background:var(--banc);
  border:0; padding:.8rem 1.4rem; cursor:pointer; min-height:44px;
}
button:hover{filter:brightness(1.1)}
button:focus-visible{outline:3px solid var(--chaux); outline-offset:3px}
footer{margin-top:2.5rem; color:var(--brume); font-size:1rem; max-width:60ch}
@media (prefers-reduced-motion:reduce){ h1{animation:none} }
</style>
</head>
<body>
<main>
  <h1>La course<span>de Zizou</span></h1>
  <div class="ecran">
    <video id="v" src="zizou.mp4" poster="poster.jpg" autoplay muted loop playsinline></video>
  </div>
  <div class="bas">
    <p class="compteur" aria-live="polite">Tu l'as regardée <strong id="n">0</strong> <span id="fois">fois</span>.</p>
    <button id="son" type="button" aria-pressed="false">Mettre le son</button>
  </div>
  <footer>Ligne de touche, costume, ballon dans le pied. Ça tourne en boucle, pour toujours.</footer>
</main>
<script>
(function(){
  var v=document.getElementById('v'), n=document.getElementById('n'), fois=document.getElementById('fois'), b=document.getElementById('son');
  var total=0, last=0;
  try{ total=parseInt(localStorage.getItem('zizou-vues')||'0',10)||0 }catch(e){}
  function show(){ n.textContent=total; }
  show();
  v.addEventListener('timeupdate',function(){
    if(v.currentTime < last - 0.5){ total++; show(); try{localStorage.setItem('zizou-vues',String(total))}catch(e){} }
    last=v.currentTime;
  });
  b.addEventListener('click',function(){
    v.muted=!v.muted;
    if(!v.muted){ v.volume=1; v.play(); }
    b.textContent=v.muted?'Mettre le son':'Couper le son';
    b.setAttribute('aria-pressed',String(!v.muted));
  });
  var p=v.play(); if(p&&p.catch)p.catch(function(){});
})();
</script>
</body>
</html>
